<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mamá Apoya - Registro</title>
    <link rel="stylesheet" href="css/materialize.min.css">
</head>
<body>

    <!-- MENÚ (IGUAL QUE EN INICIO) -->
    <nav class="purple darken-3">
        <div class="nav-wrapper container">
            <a href="index.html" class="brand-logo">Mamá Apoya</a>
            <ul id="nav-mobile" class="right hide-on-med-and-down">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="informacion.html">Información</a></li>
                <li class="active"><a href="registro.html">Registro</a></li>
                <li><a href="login.html">Iniciar Sesión</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <h2 class="center-align purple-text text-darken-3">Registro de Usuario</h2>
        <p class="center-align">Completa tus datos para formar parte de nuestra comunidad</p>

        <div class="row">
            <form class="col s12">
                <div class="row">
                    <div class="input-field col s12 m6">
                        <input id="nombre" type="text" class="validate" required>
                        <label for="nombre">Nombre completo</label>
                    </div>
                    <div class="input-field col s12 m6">
                        <input id="correo" type="email" class="validate" required>
                        <label for="correo">Correo electrónico</label>
                    </div>
                </div>

                <div class="row">
                    <div class="input-field col s12 m6">
                        <input id="contraseña" type="password" class="validate" required>
                        <label for="contraseña">Contraseña</label>
                    </div>
                    <div class="input-field col s12 m6">
                        <input id="telefono" type="tel" class="validate">
                        <label for="telefono">Teléfono de contacto</label>
                    </div>
                </div>

                <div class="row">
                    <div class="input-field col s12">
                        <select required>
                            <option value="" disabled selected>Selecciona tu rol</option>
                            <option value="madre">Madre / Cuidadora</option>
                            <option value="profesional">Profesional de apoyo</option>
                            <option value="otro">Otro</option>
                        </select>
                        <label>Tipo de usuario</label>
                    </div>
                </div>

                <div class="center-align">
                    <button class="btn purple darken-3 waves-effect waves-light" type="submit">
                        Registrarme
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/materialize.min.js"></script>
    <!-- Activar elementos dinámicos -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var elems = document.querySelectorAll('select');
            var instances = M.FormSelect.init(elems);
        });
    </script>
</body>
</html>
